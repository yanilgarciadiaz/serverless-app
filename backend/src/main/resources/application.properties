spring.application.name=hex-p1

# Puerto (solo se usa al correr la API en tu PC)
server.port=8080

# Base de datos: viene de la variable de entorno DATABASE_URL
spring.datasource.url=${DATABASE_URL}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Subida de archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Clave del JWT: viene de la variable de entorno JWT_SECRET
app.jwt.secret=${JWT_SECRET}